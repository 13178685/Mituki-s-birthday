<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#17151a"
    >

    <title>Hidden Gift</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="index-page">


    <!-- =================================
         背景
    ================================== -->

    <div class="index-bg"></div>

    <div class="index-glow"></div>


    <!-- =================================
         メイン
    ================================== -->

    <main class="index-container">


        <!-- 上部ラベル -->

        <p class="index-label">
            A LITTLE SOMETHING FOR YOU
        </p>


        <div class="index-line"></div>


        <!-- タイトル -->

        <h1 class="index-title">

            HIDDEN
            <span>GIFT</span>

        </h1>


        <!-- サブタイトル -->

        <p class="index-subtitle">
            A MEMORY PUZZLE
        </p>


        <!-- メッセージ -->

        <div class="index-message">

            <p>
                Happy Birthday, Mitsuki.
            </p>

            <p>
                今日はあなたのためだけに
                <br>
                小さな謎解きを用意しました。
            </p>

        </div>


        <!-- 日付 -->

        <p class="index-date">
            2026 . 09 . 26
        </p>


        <!-- START -->

        <button
            id="startButton"
            class="index-start"
        >

            <span>
                START
            </span>

            <small>
                BEGIN 
            </small>

        </button>


        <!-- 下部 -->

        <p class="index-footer">
            SOME MEMORIES ARE BETTER
            <br>
            WHEN YOU LOOK TWICE.
        </p>


    </main>


    <!-- =================================
         JS
    ================================== -->

    <script src="script.js"></script>


</body>

</html>
